<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EcoTechDZ - الرئيسية</title>
    <!-- إضافة مكتبات الذكاء الاصطناعي -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
        .nav-bar { background: #287456; padding: 15px; color: white; text-align: center; border-radius: 5px; margin-bottom: 20px; }
        .nav-bar a { color: white; margin: 0 5px; text-decoration: none; font-weight: bold; }
        .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="municipal_dashboard.html">لوحة البلديات</a>
        <a href="admin_dashboard.html">لوحة المدير</a>
    </div>

    <div style="text-align: center;">
        <div class="logo-container">
            <img src="logo.jpeg" alt="EcoTechDZ Logo">
        </div>
        <h1>EcoTechDZ</h1>
        <h3>الاقتصاد الدائري في سكيكدة - نحو جزائر خضراء</h3>
    </div>

    <div class="box">
        <h3>الكاميرا الذكية : تصنيف ووزن</h3>
        <video id="webcam" width="100%" autoplay playsinline style="background:#000; border-radius: 8px;"></video>
        <button onclick="startCamera()">تشغيل الكاميرا</button>
        <button onclick="classifyWaste()" style="background:#007bff">بدء التصنيف الذكي</button>
        <p id="aiStatus" style="text-align:center; color:#555; font-size: 13px;">جاري تحميل نموذج الذكاء الاصطناعي...</p>
    </div>

    <div class="box">
        <h3>بيانات العملية والربط</h3>
       
        <!-- قسم صفقة التوريد -->
        <div style="background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #ffeeba;">
            <label style="font-weight: bold; font-size: 13px; color: #856404;">
                <input type="checkbox" id="contractDealToggle" onchange="toggleContractDeal()" style="width: auto; margin-left: 5px;">
                تفعيل صفقة توريد متفق عليها (للنفايات الحيوانية / النباتية)
            </label>
            <div id="contractDetails" style="display:none; margin-top: 8px;">
                <input type="number" id="contractMaxWeight" placeholder="أدخل الكمية الإجمالية المتفق عليها (كغ)" oninput="checkContractLimit()">
                <small style="color: #666; display: block;">ملاحظة: ستتوقف هذه النفايات تلقائيًا عند استنفاز الكمية المحددة.</small>
            </div>
        </div>

        <!-- قسم صفقة التصريف -->
        <div style="background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #f5c6cb;">
            <label style="font-weight: bold; font-size: 13px; color: #721c24;">
                <input type="checkbox" id="contractDisposalToggle" onchange="toggleDisposalDetails()" style="width: auto; margin-left: 5px;">
                تفعيل صفقة تصريف متفق عليها للنفايات
            </label>
            <div id="disposalDetails" style="display:none; margin-top: 8px;">
                <input type="number" id="disposalMaxWeight" placeholder="أدخل الكمية المراد تصريفها (كغ)">
            </div>
        </div>

        <select id="wasteType" onchange="updatePrice()">
            <option value="">اختر نوع النفايات</option>
            <option value="بلاستيك">بلاستيك</option>
            <option value="معادن">معادن</option>
            <option value="ورق">ورق</option>
            <option value="زجاج">زجاج</option>
            <option id="mainOptAnimal" value="نفايات حيوانية" style="display:none;">نفايات حيوانية (للجولاجين)</option>
            <option id="mainOptPlant" value="نفايات نباتية" style="display:none;">نفايات نباتية (أسمدة وزيوت)</option>
        </select>

        <input type="number" id="weight" placeholder="الوزن (كغ)" oninput="updatePrice()">
        <input type="text" id="price" placeholder="الإجمالي (دج)" readonly>

        <select id="actionType">
            <option value="بيع">بيع</option>
            <option value="شراء">شراء</option>
        </select>

        <select id="paymentMethod" onchange="togglePaymentFields()">
            <option value="عند التسليم">عند التسليم</option>
            <option value="بريدي موب">بريدي موب</option>
            <option value="البطاقة الذهبية">البطاقة الذهبية</option>
        </select>

        <div id="paymentDetails" style="display:none;">
            <input type="text" id="cardNumber" placeholder="رقم الحساب / البطاقة">
            <input type="password" id="cardCode" placeholder="كود التحقق السري">
        </div>

        <select id="userType">
            <option value="فرد">فرد</option>
            <option value="مؤسسة">مؤسسة عمومية أو خاصة</option>
            <option value="ورشة صناعية">ورشة صناعية</option>
            <option value="مستثمر">مستثمر</option>
            <option value="ناقل نفايات">ناقل نفايات (صاحب شاحنة نقل)</option>
            <option value="مركز معالجة">مركز معالجة وإعادة تدوير</option>
            <option value="بلدية">بلدية</option>
        </select>

        <input type="text" id="location" placeholder="حدد موقع الحي أو المنزل عبر الـ GPS" readonly>
        <button onclick="getLocation()" style="background:#6c757d">تحديد الموقع (GPS)</button>

        <button onclick="submitTransaction()" style="background:#dc3545; margin-top:10px;">تأكيد العملية</button>
    </div>

    <script>
        let aiModel;

        mobilenet.load().then(loadedModel => {
            aiModel = loadedModel;
            document.getElementById('aiStatus').innerText = "الذكاء الاصطناعي جاهز للتعرف على النفايات!";
        });

        const pricelist = {
            "بلاستيك": 8,
            "معادن": 15,
            "ورق": 20,
            "زجاج": 10,
            "نفايات حيوانية": 50,
            "نفايات نباتية": 30
        };

        function toggleContractDeal() {
            const isChecked = document.getElementById('contractDealToggle').checked;
            const details = document.getElementById('contractDetails');
            const mainOptAnimal = document.getElementById('mainOptAnimal');
            const mainOptPlant = document.getElementById('mainOptPlant');
           
            if (isChecked) {
                details.style.display = 'block';
                mainOptAnimal.style.display = 'block';
                mainOptPlant.style.display = 'block';
            } else {
                details.style.display = 'none';
                mainOptAnimal.style.display = 'none';
                mainOptPlant.style.display = 'none';
                const currentVal = document.getElementById('wasteType').value;
                if(currentVal === 'نفايات حيوانية' || currentVal === 'نفايات نباتية') {
                    document.getElementById('wasteType').value = '';
                    updatePrice();
                }
            }
        }

        function toggleDisposalDetails() {
            const isChecked = document.getElementById('contractDisposalToggle').checked;
            const details = document.getElementById('disposalDetails');
            details.style.display = isChecked ? 'block' : 'none';
        }

        function checkContractLimit() {
            const maxW = parseFloat(document.getElementById('contractMaxWeight').value) || 0;
            let allOps = JSON.parse(localStorage.getItem('allOperations') || '[]');
            let deliveredWeight = allOps.filter(op => op.type === 'نفايات حيوانية' || op.type === 'نفايات نباتية')
                                        .reduce((sum, op) => sum + (parseFloat(op.weight) || 0), 0);
           
            if (maxW > 0 && deliveredWeight >= maxW) {
                alert("لقد بلغت الكمية الإجمالية المتفق عليها لصفقة التوريد! سيتم إيقاف ظهور هذه النفايات.");
                document.getElementById('contractDealToggle').checked = false;
                toggleContractDeal();
            }
        }

        function updatePrice() {
            const type = document.getElementById('wasteType').value;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            if (pricelist[type] && weight > 0) {
                document.getElementById('price').value = pricelist[type] * weight;
            } else {
                document.getElementById('price').value = '';
            }
        }

        function togglePaymentFields() {
            const method = document.getElementById('paymentMethod').value;
            const details = document.getElementById('paymentDetails');
            if(method === 'البطاقة الذهبية' || method === 'بريدي موب') {
                details.style.display = 'block';
            } else {
                details.style.display = 'none';
            }
        }

        async function startCamera() {
            try {
                const video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                alert("تعذر تشغيل الكاميرا: تأكد من الأذونات.");
            }
        }

        async function classifyWaste() {
            if (!aiModel) {
                alert("الرجاء الانتظار قليلاً حتى يتم تحميل نموذج الذكاء الاصطناعي.");
                return;
            }
            const video = document.getElementById('webcam');
            if (!video.srcObject) {
                alert("يرجى تشغيل الكاميرا أولاً!");
                return;
            }
            try {
                const predictions = await aiModel.classify(video);
                if (predictions && predictions.length > 0) {
                    const topPrediction = predictions[0].className.toLowerCase();
                    let selectedType = "بلاستيك";
                   
                    if (topPrediction.includes('bottle') || topPrediction.includes('plastic') || topPrediction.includes('container')) {
                        selectedType = "بلاستيك";
                    } else if (topPrediction.includes('glass') || topPrediction.includes('jar')) {
                        selectedType = "زجاج";
                    } else if (topPrediction.includes('paper') || topPrediction.includes('box') || topPrediction.includes('cardboard')) {
                        selectedType = "ورق";
                    } else if (topPrediction.includes('metal') || topPrediction.includes('can') || topPrediction.includes('aluminum')) {
                        selectedType = "معادن";
                    }
                   
                    document.getElementById('wasteType').value = selectedType;
                    document.getElementById('weight').value = (Math.random() * (1.5 - 0.3) + 0.3).toFixed(1);
                    updatePrice();
                   
                    alert("تم رصد النفايات بالذكاء الاصطناعي وتحديد النوع (" + selectedType + ") بنجاح!");
                }
            } catch (e) {
                alert("حدث خطأ أثناء التصنيف بالذكاء الاصطناعي.");
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude.toFixed(4);
                    const lon = position.coords.longitude.toFixed(4);
                    document.getElementById('location').value = `خط عرض: ${lat}, خط طول: ${lon}`;
                }, () => {
                    alert("تعذر تحديد الموقع الجغرافي.");
                });
            } else {
                alert("المتصفح لا يدعم تحديد الموقع.");
            }
        }

        function submitTransaction() {
            const wasteType = document.getElementById('wasteType').value;
            const weight = document.getElementById('weight').value;
            const userType = document.getElementById('userType').value;
            const actionType = document.getElementById('actionType').value;
            const price = document.getElementById('price').value;
            const location = document.getElementById('location').value;

            if (!wasteType || !weight) {
                alert("يرجى اختيار نوع النفايات وإدخال الوزن!");
                return;
            }

            const transaction = {
                user: userType,          /* تم ضبطها لتعرض اسم المستخدم/نوعه بشكل صحيح في الجداول */
                userType: userType,
                type: wasteType,
                weight: weight,
                actionType: actionType,
                price: price,
                location: location || 'غير محدد',
                date: new Date().toLocaleDateString()
            };

            // الحفظ تحت مفتاح allOperations (الخاص بلوحة المدير والبلديات)
            let allOps = JSON.parse(localStorage.getItem('allOperations') || '[]');
            allOps.push(transaction);
            localStorage.setItem('allOperations', JSON.stringify(allOps));

            // الحفظ تحت مفتاح transactions (الخاص بلوحة التحكم)
            let userOps = JSON.parse(localStorage.getItem('transactions') || '[]');
            userOps.push(transaction);
            localStorage.setItem('transactions', JSON.stringify(userOps));

            alert("تم تأكيد العملية بنجاح وتسجيلها في النظام!");
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
