<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المدير - EcoTechDZ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; margin: 0; }
        .nav-bar { background: #287456; padding: 15px; color: white; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .nav-bar a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h3 { color: #287456; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #dee2e6; text-align: center; }
        th { background-color: #f8f9fa; color: #287456; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="municipal_dashboard.html">لوحة البلديات</a>
        <a href="admin_dashboard.html">لوحة المدير</a>
    </nav>

    <!-- قسم العقود والاتفاقيات -->
    <div class="card">
        <h3>إدارة العقود والاتفاقيات (توريد وتصريف)</h3>
        <table>
            <thead>
                <tr>
                    <th>المؤسسة / المستثمر</th>
                    <th>نوع النفايات</th>
                    <th>نوع العقد</th>
                    <th>قيمة العقد/الشهر</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="contractsTable"></tbody>
        </table>
    </div>

    <!-- سجل العمليات العام -->
    <div class="card">
        <h3>سجل العمليات العام</h3>
        <table>
            <thead>
                <tr>
                    <th>إيميل المستخدم</th>
                    <th>نوع المستخدم المحدد</th>
                    <th>نوع النفايات</th>
                    <th>الوزن</th>
                    <th>نوع العملية</th>
                    <th>الموقع (GPS)</th>
                </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>

    <script>
        const history = JSON.parse(localStorage.getItem('allOperations') || "[]");
        const tbody = document.getElementById('adminTableBody');
        const contractsTable = document.getElementById('contractsTable');
       
        // جلب سجل العمليات العام وعرض الإيميل ونوع المستخدم المحدد بدقة
        tbody.innerHTML = "";
        if (history.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6'>لا توجد عمليات مسجلة حالياً.</td></tr>";
        } else {
            history.forEach(item => {
                let row = tbody.insertRow();
                // التأكد من جلب البريد المخزن في العملية أو استخدام البريد المسجل حالياً كبديل
                let userEmail = item.email || localStorage.getItem("loggedInUserEmail") || "user@ecotech.dz";
               
                row.innerHTML = `
                    <td style="color: #007bff; font-weight: 500;">${userEmail}</td>
                    <td><span style="background: #e2f0d9; padding: 4px 8px; border-radius: 4px; color: #287456; font-weight: bold;">${item.userType || '-'}</span></td>
                    <td style="font-weight:bold;">${item.type || '-'}</td>
                    <td>${item.weight || 0} كغ</td>
                    <td>${item.actionType || '-'}</td>
                    <td style="font-size: 11px;">${item.location || 'غير محدد'}</td>
                `;
            });
        }

        // جدول العقود
        const contracts = JSON.parse(localStorage.getItem('contracts') || "[]");
        contractsTable.innerHTML = "";
        if (contracts.length === 0) {
            contractsTable.innerHTML = "<tr><td colspan='5'>لا توجد عقود مسجلة حاليًا.</td></tr>";
        } else {
            contracts.forEach(contract => {
                let row = contractsTable.insertRow();
                row.innerHTML = `
                    <td>${contract.company || '-'}</td>
                    <td>${contract.type || '-'}</td>
                    <td>${contract.contractType || '-'}</td>
                    <td>${contract.value || 0} دج</td>
                    <td><span style="color: green; font-weight: bold;">${contract.status || 'ساري'}</span></td>
                `;
            });
        }
    </script>
</body>
</html>
