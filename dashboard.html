<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - EcoTechDZ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; padding: 20px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #f8f9fa; color: #287456; }
        .nav-bar { background: #287456; padding: 15px; color: white; text-align: center; border-radius: 10px; }
        .nav-bar a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="municipal_dashboard.html">لوحة البلديات</a>
        <a href="admin_dashboard.html">لوحة المدير</a>
    </div>

    <div class="card">
        <h3>رصيدك البيئي التراكمي</h3>
        <div id="user-points" style="font-size: 40px; color: #287456; font-weight: bold;">0</div>
        <p>نقطة مكتسبة للأفراد عند عمليات البيع فقط</p>
    </div>

    <div class="card">
        <h3>سجل العمليات الشامل</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>نوع المستخدم</th>
                    <th>نوع العملية</th>
                    <th>الوزن (كغ)</th>
                    <th>النقاط</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- سيتم تعبئة البيانات تلقائياً هنا -->
            </tbody>
        </table>
    </div>

    <script>
        function loadOperations() {
            const tbody = document.getElementById('historyBody');
            let totalPoints = 0;
           
            // جلب العمليات من التخزين المشترك
            const allHistory = JSON.parse(localStorage.getItem('allOperations') || '[]');
           
            tbody.innerHTML = "";
           
            if (allHistory.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6'>لا توجد عمليات مسجلة حتى الآن</td></tr>";
                document.getElementById('user-points').innerText = "0";
                return;
            }
           
            allHistory.forEach(item => {
                let row = tbody.insertRow();
               
                // احتساب النقاط للأفراد عند عملية البيع
                let points = (item.actionType === 'بيع' && item.userType === 'فرد') ? (parseFloat(item.weight) * 10 || 10) : (item.points || 0);
               
                row.innerHTML = `
                    <td>${item.type || '-'}</td>
                    <td>${item.userType || '-'}</td>
                    <td>${item.actionType || '-'}</td>
                    <td>${item.weight || 0}</td>
                    <td>${points}</td>
                    <td>${item.date || '-'}</td>
                `;
               
                totalPoints += parseFloat(points);
            });
           
            document.getElementById('user-points').innerText = totalPoints;
        }

        loadOperations();
    </script>
</body>
</html>
