<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EcoTechDZ - لوحة التحكم</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #f8f9fa; color: #287456; }
    </style>
</head>
<body>
    <nav style="background: #287456; padding: 15px; color: white; text-align: center; border-radius: 10px;">
        <a href="index.html" style="color: white; margin: 0 10px; text-decoration: none;">الرئيسية</a>
        <a href="dashboard.html" style="color: white; margin: 0 10px; text-decoration: none;">لوحة التحكم</a>
        <a href="municipal_dashboard.html" style="color: white; margin: 0 10px; text-decoration: none;">لوحة البلديات</a>
        <a href="admin_dashboard.html" style="color: white; margin: 0 10px; text-decoration: none;">لوحة المدير</a>
    </nav>

    <div class="card">
        <h3>رصيدك البيئي التراكمي</h3>
        <div id="user-points" style="font-size: 40px; color: #287456; font-weight: bold;">0</div>
        <p>نقطة مكتسبة للأفراد عند عمليات البيع فقط</p>
    </div>

    <div class="card">
        <h3>سجل العمليات الشامل</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>نوع المستخدم</th>
                    <th>نوع العملية</th>
                    <th>الوزن (كغ)</th>
                    <th>النقاط</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <script>
        function loadOperations() {
            const currentUserEmail = localStorage.getItem("loggedInUserEmail");
            const tbody = document.getElementById('historyBody');
            let totalPoints = 0;

            const allHistory = JSON.parse(localStorage.getItem('allOperations')) || [];
           
            if (allHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">لا توجد عمليات مسجلة لك حتى الآن</td></tr>`;
                document.getElementById('user-points').innerText = "0";
                return;
            }

            // تصفية العمليات الخاصة بالمستخدم الحالي أو عرض الكل حسب الحاجة
            const userHistory = currentUserEmail ? allHistory.filter(item => item.email === currentUserEmail) : allHistory;
           
            tbody.innerHTML = "";
            if (userHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">لا توجد عمليات مسجلة لك حتى الآن</td></tr>`;
                document.getElementById('user-points').innerText = "0";
                return;
            }

            userHistory.forEach(item => {
                let row = tbody.insertRow();
                let points = (item.userType === 'فرد' && item.actionType === 'بيع') ? (item.points || 0) : 0;
               
                row.innerHTML = `
                    <td>${item.type || '-'}</td>
                    <td>${item.userType || '-'}</td>
                    <td>${item.actionType || '-'}</td>
                    <td>${item.weight || 0}</td>
                    <td>${points}</td>
                    <td>${item.date || '-'}</td>
                `;
                totalPoints += parseFloat(points);
            });

            document.getElementById('user-points').innerText = totalPoints;
        }

        loadOperations();
    </script>
</body>
</html>
